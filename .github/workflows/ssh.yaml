name: learn-github-actions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python:
   runs-on: ubuntu-latest

   steps:
     - name: Checkout Repository
       uses: actions/checkout@v4 #git clone

     - name: Set Up Python
       uses: actions/setup-python@v5
       with:
         python-version: "3.13"  #파이썬 설치 - Plugin 설치

     - name: Display Python Version
       run: python --version #shell 명령어 수행: 젠킨스에서는 sh "명령어"
    
