name: ci-test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-test-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pytest
  build:
    needs: [run-test-code]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt

      - name: Image Build
        run: docker build -t ggnagpae1/flaskweb:latest .
      - name: Image Display
        run: docker images
      - name: Docker Hub Login
        uses: docker/login-action@v1
        with:
          username: ggnagpae1
          password: ${{ secrets.DOCKERHUB_TOKEN}}
      - name: Image Push
        run: docker push ggnagpae1/flaskweb:latest
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ggnagpae1
          DOCKER_REPO: flaskweb
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN}}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME, DOCKER_REPO, DOCKER_TOKEN
          debug: true
          timeout: 30s
          command_timeout: 5m
          request_pty: true
          use_insecure_cipher: true
          script: |
            echo "Successfully Connected"
            echo "Starting deployment for: $DOCKER_USERNAME/$DOCKER_REPO"

